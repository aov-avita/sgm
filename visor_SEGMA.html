<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Segma</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .galeria-item {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.3);
      transition: transform .3s ease;
    }

    .galeria-item:hover {
      transform: translateY(-5px);
    }

    .galeria-item img,
    .galeria-item video {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal img,
    .modal video {
      max-width: 90%;
      max-height: 85%;
      border-radius: 8px;
    }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>Galería Segma</h1>
  <p>Visualización en tiempo real desde Cloudinary</p>
</header>

<div id="loading">Cargando contenido...</div>

<main class="galeria" id="galeria"></main>

<div id="modal" class="modal" onclick="cerrarVisor()">

  <img id="imgModal" style="display:none">

  <video id="videoModal"
          controls
          style="display:none">
  </video>

</div>

<script>

const cloudName = 'gc52w8os';
const tag = 'segma';

Promise.all([

  fetch(`https://res.cloudinary.com/${cloudName}/image/list/${tag}.json`)
    .then(r => r.json())
    .catch(() => ({ resources: [] })),

  fetch(`https://res.cloudinary.com/${cloudName}/video/list/${tag}.json`)
    .then(r => r.json())
    .catch(() => ({ resources: [] }))

])

.then(([imagenes, videos]) => {

  document.getElementById('loading').style.display = 'none';

  const galeria = document.getElementById('galeria');

  const recursos = [];

  imagenes.resources.forEach(img => {

    recursos.push({
      tipo: 'imagen',
      version: img.version,
      public_id: img.public_id,
      format: img.format
    });

  });

  videos.resources.forEach(video => {

    recursos.push({
      tipo: 'video',
      version: video.version,
      public_id: video.public_id,
      format: video.format
    });

  });

  recursos.sort((a,b) => b.version - a.version);

  recursos.forEach(item => {

    const container = document.createElement('div');
    container.className = 'galeria-item';

    if(item.tipo === 'imagen'){

      const url =
      `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto/v${item.version}/${item.public_id}.${item.format}`;

      container.innerHTML = `
        <img
          src="${url}"
          alt="${item.public_id}"
          onclick="abrirImagen('${url}')">
      `;

    } else {

      const url =
      `https://res.cloudinary.com/${cloudName}/video/upload/f_auto,q_auto/v${item.version}/${item.public_id}.${item.format}`;

      container.innerHTML = `
        <video onclick="abrirVideo('${url}')">
          <source src="${url}" type="video/${item.format}">
        </video>
      `;

    }

    galeria.appendChild(container);

  });

})

.catch(error => {

  document.getElementById('loading').innerText =
    'Error al cargar archivos desde Cloudinary.';

  console.error(error);
});

function abrirImagen(src) {

  document.getElementById('videoModal').pause();
  document.getElementById('videoModal').style.display = 'none';

  document.getElementById('imgModal').src = src;
  document.getElementById('imgModal').style.display = 'block';

  document.getElementById('modal').style.display = 'flex';
}

function abrirVideo(src) {

  document.getElementById('imgModal').style.display = 'none';

  const video = document.getElementById('videoModal');

  video.src = src;
  video.style.display = 'block';

  document.getElementById('modal').style.display = 'flex';

  video.play();
}

function cerrarVisor() {

  document.getElementById('modal').style.display = 'none';

  const video = document.getElementById('videoModal');
  video.pause();
  video.src = '';
}

</script>

</body>
</html>
