<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualizador SEGMA</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:40px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
    text-align:center;
}

button{
    background:#198754;
    color:white;
    border:none;
    width:100%;
    padding:12px;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#157347;
}

input[type=file]{
    width:100%;
    margin-top:20px;
}

#estado{
    margin-top:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>Actualizar avanceSEGMA.xlsx</h2>

<input type="file" id="archivo" accept=".xlsx">

<button id="btnSubir">
Actualizar GitHub
</button>

<button id="btnToken">
Cambiar Token
</button>

<div id="estado"></div>

</div>

<script>

const OWNER = "aov-avita";
const REPO = "sgm";
const BRANCH = "main";
const FILE_PATH = "avanceSEGMA.xlsx";

let token = localStorage.getItem("github_token");

async function pedirToken(){

    const nuevoToken = prompt(
        "Ingrese su Token GitHub:"
    );

    if(nuevoToken){

        localStorage.setItem(
            "github_token",
            nuevoToken.trim()
        );

        token = nuevoToken.trim();

        mostrarEstado(
            "✅ Token guardado",
            "green"
        );
    }
}

if(!token){
    pedirToken();
}

function mostrarEstado(texto,color){

    const e =
        document.getElementById("estado");

    e.innerHTML = texto;
    e.style.color = color;
}

function fileToBase64(file){

    return new Promise((resolve,reject)=>{

        const reader = new FileReader();

        reader.onload = () => {

            const base64 =
                reader.result.split(",")[1];

            resolve(base64);

        };

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}

async function subirArchivo(){

    try{

        if(!token){

            mostrarEstado(
                "❌ No existe token",
                "red"
            );

            return;
        }

        const archivo =
            document.getElementById("archivo")
            .files[0];

        if(!archivo){

            mostrarEstado(
                "❌ Seleccione un archivo",
                "red"
            );

            return;
        }

        mostrarEstado(
            "⏳ Procesando...",
            "orange"
        );

        const contenido =
            await fileToBase64(archivo);

        const respuestaSHA =
            await fetch(
                `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,
                {
                    headers:{
                        Authorization:
                        `Bearer ${token}`
                    }
                }
            );

        if(!respuestaSHA.ok){

            throw new Error(
                "No fue posible leer el archivo actual."
            );

        }

        const archivoActual =
            await respuestaSHA.json();

        const sha = archivoActual.sha;

        const respuestaUpdate =
            await fetch(
                `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,
                {
                    method:"PUT",
                    headers:{
                        Authorization:
                        `Bearer ${token}`,
                        "Content-Type":
                        "application/json"
                    },
                    body:JSON.stringify({
                        message:
                        "Actualizacion avanceSEGMA.xlsx",
                        content:
                        contenido,
                        sha:
                        sha,
                        branch:
                        BRANCH
                    })
                }
            );

        if(!respuestaUpdate.ok){

            const error =
                await respuestaUpdate.text();

            throw new Error(error);

        }

        mostrarEstado(
            "✅ Archivo actualizado correctamente",
            "green"
        );

    }
    catch(error){

        console.error(error);

        mostrarEstado(
            "❌ " + error.message,
            "red"
        );

    }

}

document
.getElementById("btnSubir")
.addEventListener(
    "click",
    subirArchivo
);

document
.getElementById("btnToken")
.addEventListener(
    "click",
    pedirToken
);

</script>

</body>
</html>
