<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizar avanceSEGMA.xlsx</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:40px;
}

.card{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    text-align:center;
}

h2{
    margin-bottom:20px;
}

input[type=file]{
    margin:20px 0;
}

button{
    background:#238636;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    margin:5px;
}

button:hover{
    background:#2ea043;
}

.status{
    margin-top:20px;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}
</style>
</head>
<body>

<div class="card">

<h2>Actualizar avanceSEGMA.xlsx</h2>

<p id="tokenStatus"></p>

<input type="file" id="fileInput" accept=".xlsx">

<br>

<button onclick="subirArchivo()">
Actualizar GitHub
</button>

<button onclick="cambiarToken()">
Cambiar Token
</button>

<div id="status" class="status"></div>

</div>

<script>

const OWNER = "aov-avita";
const REPO = "sgm";
const BRANCH = "main";
const FILE_PATH = "avanceSEGMA.xlsx";

let TOKEN = localStorage.getItem("github_token");

if (!TOKEN) {

    TOKEN = prompt("Ingrese su Token GitHub:");

    if (TOKEN) {
        localStorage.setItem("github_token", TOKEN);
    }

}

actualizarEstadoToken();

function actualizarEstadoToken(){

    document.getElementById("tokenStatus").innerHTML =
        TOKEN
        ? "✅ Token GitHub cargado"
        : "❌ No hay token configurado";

}

function cambiarToken(){

    const nuevo = prompt("Ingrese el nuevo Token GitHub:");

    if(nuevo){

        TOKEN = nuevo;
        localStorage.setItem("github_token", nuevo);

        actualizarEstadoToken();

        alert("Token actualizado correctamente.");

    }

}

function convertirBase64(file){

    return new Promise((resolve,reject)=>{

        const reader = new FileReader();

        reader.readAsDataURL(file);

        reader.onload = () => {

            resolve(reader.result.split(',')[1]);

        };

        reader.onerror = error => reject(error);

    });

}

async function subirArchivo(){

    const status = document.getElementById("status");

    const file = document.getElementById("fileInput").files[0];

    if(!TOKEN){

        status.innerHTML =
            "<span class='error'>❌ No hay token configurado.</span>";

        return;

    }

    if(!file){

        status.innerHTML =
            "<span class='error'>❌ Seleccione un archivo Excel.</span>";

        return;

    }

    if(!file.name.toLowerCase().endsWith(".xlsx")){

        status.innerHTML =
            "<span class='error'>❌ Sólo se permiten archivos .xlsx</span>";

        return;

    }

    status.innerHTML = "⏳ Convirtiendo archivo...";

    try{

        const contenidoBase64 = await convertirBase64(file);

        status.innerHTML = "⏳ Obteniendo SHA actual...";

        const archivoActual = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,
            {
                headers:{
                    "Authorization":`Bearer ${TOKEN}`,
                    "Accept":"application/vnd.github+json"
                }
            }
        );

        if(!archivoActual.ok){

            const err = await archivoActual.text();
            throw new Error(err);

        }

        const dataActual = await archivoActual.json();

        status.innerHTML = "⏳ Actualizando repositorio...";

        const respuesta = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,
            {
                method:"PUT",
                headers:{
                    "Authorization":`Bearer ${TOKEN}`,
                    "Accept":"application/vnd.github+json",
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    message:`Actualización automática avanceSEGMA.xlsx ${new Date().toLocaleString()}`,
                    content:contenidoBase64,
                    sha:dataActual.sha,
