<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Segma</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .galeria-item {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .galeria-item:hover {
      transform: translateY(-5px);
    }

    .galeria-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    /* Modal / Lightbox */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal img {
      max-width: 90%;
      max-height: 85%;
      border-radius: 8px;
    }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <h1>Galería de Fotos - Segma</h1>
    <p>Visualización en tiempo real desde Cloudinary</p>
  </header>

  <div id="loading">Cargando fotos...</div>
  <main class="galeria" id="galeria"></main>

  <!-- Modal para ampliar imagen -->
  <div id="modal" class="modal" onclick="cerrarVisor()">
    <img id="imgModal" src="" alt="Vista ampliada">
  </div>

  <script>
    const cloudName = 'gc52w8os';
    const tag = 'segma'; // Etiqueta asignada a tus imágenes en la carpeta segma

    // Obtener la lista de imágenes con el tag 'segma'
    fetch(`https://res.cloudinary.com/${cloudName}/image/list/${tag}.json`)
      .then(response => response.json())
      .then(data => {
        const galeria = document.getElementById('galeria');
        document.getElementById('loading').style.display = 'none';

        data.resources.forEach(img => {
          const container = document.createElement('div');
          container.className = 'galeria-item';

          const urlImagen = `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto/v${img.version}/${img.public_id}.${img.format}`;

          container.innerHTML = `<img src="${urlImagen}" alt="${img.public_id}" onclick="abrirVisor('${urlImagen}')">`;
          galeria.appendChild(container);
        });
      })
      .catch(error => {
        document.getElementById('loading').innerText = 'No se pudieron cargar las fotos. Verifica haber asignado la etiqueta "segma" y activado "Resource list" en Cloudinary.';
        console.error(error);
      });

    function abrirVisor(src) {
      document.getElementById('imgModal').src = src;
      document.getElementById('modal').style.display = 'flex';
    }

    function cerrarVisor() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>

</body>
</html>
