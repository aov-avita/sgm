<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Galería Pública</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .galeria img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .galeria img:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <h1>Mis Fotos</h1>

  <div class="galeria">
    <!-- Sustituye los enlaces de ejemplo por las URLs directas de tus fotos de ImgBB -->
    <img src="https://i.ibb.co/ejemplo1/foto1.jpg" alt="Descripción de la foto 1">
    <img src="https://i.ibb.co/ejemplo2/foto2.jpg" alt="Descripción de la foto 2">
    <img src="https://i.ibb.co/ejemplo3/foto3.jpg" alt="Descripción de la foto 3">
  </div>

</body>
</html>
